<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importando a biblioteca do PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Nosso Espaço Privado ❤️</h1>
        
        <div class="controls">
            <p>Seu Código Secreto: <b id="my-id">Gerando...</b></p>
            <input type="text" id="connect-id" placeholder="Cole o código do seu amor aqui">
            <button id="call-btn">Ligar</button>
            <button id="share-screen-btn">Compartilhar Tela</button>
        </div>

        <div class="video-grid">
            <div class="video-wrapper">
                <h3>Você</h3>
                <video id="local-video" autoplay muted playsinline></video>
            </div>
            <div class="video-wrapper">
                <h3>Seu Amor</h3>
                <video id="remote-video" autoplay playsinline></video>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
